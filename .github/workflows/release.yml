name: Release

on:
  push:
    tags:
      - 'v*'
      - 'v*-beta.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Create the draft release first so all platform builds can upload to it
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "VS Code Launchpad ${{ github.ref_name }}" \
            --draft \
            --notes "" 2>&1 || echo "Release already exists, continuing"

  # Build full application (React frontend + sidecar + Tauri desktop app) per platform
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            pkg-target: 'node18-macos-arm64'
            triple: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            pkg-target: 'node18-macos-x64'
            triple: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            pkg-target: 'node18-linux-x64'
            triple: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            pkg-target: 'node18-win-x64'
            triple: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          cat src-tauri/tauri.conf.json | jq '.version'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build

      - name: Build sidecar binary
        shell: bash
        run: |
          EXTENSION=""
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            EXTENSION=".exe"
          fi
          npx pkg server/index.js \
            --config pkg.config.json \
            --targets "${{ matrix.pkg-target }}" \
            --output "src-tauri/binaries/sidecar-vscode-dashboard-${{ matrix.triple }}${EXTENSION}"

      - name: Make sidecar executable (Unix)
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/sidecar-vscode-dashboard*

      - name: Warn if macOS code signing is not configured
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE == ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "::warning::macOS code signing skipped — APPLE_CERTIFICATE secret is not configured."
          echo "To enable signing, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, and APPLE_SIGNING_IDENTITY secrets."
          echo "See docs/MACOS-CODE-SIGNING.md for setup instructions."

      - name: Build Tauri app
        shell: bash
        run: |
          ./node_modules/.bin/tauri build ${{ matrix.args }}
          echo "Tauri build complete"

      - name: Import Apple code signing certificate
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="signing.keychain"
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN"
          security create-keychain -p temp "$KEYCHAIN_PATH" || true
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp "$KEYCHAIN_PATH"
          echo "Certificate imported"

      # macOS 26+ sidecar signing fix + artifact upload
      - name: Create and upload release artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIPLE="${{ matrix.triple }}"
          # --target outputs to target/<triple>/; without it, target/release/
          if [ -d "src-tauri/target/$TRIPLE/release" ]; then
            TARGET_DIR="src-tauri/target/$TRIPLE/release"
          else
            TARGET_DIR="src-tauri/target/release"
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="$TARGET_DIR/bundle/macos/VS Code Launchpad.app"
          SIDECAR_PATH="$APP_PATH/Contents/MacOS/sidecar-vscode-dashboard"

          # Fix sidecar signing for macOS 26+ (see docs/superpowers/debugging/2026-07-21-sidecar-macos-26-compat.md)
          codesign --remove-signature "$SIDECAR_PATH"
          codesign -s - "$SIDECAR_PATH"
          echo "=== Sidecar after fix ==="
          codesign -d -vvv "$SIDECAR_PATH" 2>&1 | grep -E "flags=|Signature=" || true

          # Re-sign bundle (without --deep to preserve ad-hoc sidecar signature)
          APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign -f -s "$APPLE_SIGNING_IDENTITY" "$APP_PATH"
          else
            codesign -f -s - "$APP_PATH"
          fi

          codesign --verify -v --strict --deep "$APP_PATH" 2>&1

          # Create .app.tar.gz and .dmg with platform/arch/version names
          ARCH="$(echo "$TRIPLE" | grep -q aarch64 && echo "aarch64" || echo "x64")"
          TARBALL="VS.Code.Launchpad_macos_${VERSION}_${ARCH}.app.tar.gz"
          DMG="VS.Code.Launchpad_macos_${VERSION}_${ARCH}.dmg"
          MACOS_BUNDLE_DIR="$TARGET_DIR/bundle/macos"

          tar czf "$TARBALL" -C "$MACOS_BUNDLE_DIR" "VS Code Launchpad.app"
          hdiutil create -volname "VS Code Launchpad" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG" 2>&1

          gh release upload "${{ github.ref_name }}" "$TARBALL" "$DMG" \
            --repo "${{ github.repository }}" --clobber 2>&1 || {
            echo "Upload failed — creating release and retrying..."
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "VS Code Launchpad ${{ github.ref_name }}" \
              --draft --notes "" 2>&1
            gh release upload "${{ github.ref_name }}" "$TARBALL" "$DMG" \
              --repo "${{ github.repository }}" --clobber
          }
          echo "macOS $ARCH artifacts uploaded"

      # Upload Linux/Windows artifacts
      - name: Create and upload release artifacts (non-macOS)
        if: matrix.platform != 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIPLE="${{ matrix.triple }}"
          VERSION="${GITHUB_REF_NAME#v}"

          case "${{ matrix.platform }}" in
            ubuntu-22.04) PLATFORM="linux" ;;
            windows-latest) PLATFORM="windows" ;;
          esac

          # --target outputs to target/<triple>/; without it, target/release/
          if [ -d "src-tauri/target/$TRIPLE/release" ]; then
            TARGET_DIR="src-tauri/target/$TRIPLE/release"
          else
            TARGET_DIR="src-tauri/target/release"
          fi
          BUNDLE_DIR="$TARGET_DIR/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::warning::Bundle directory not found at $BUNDLE_DIR"
            ls -laR "$TARGET_DIR"
            exit 0
          fi
          echo "Bundle contents:"
          find "$BUNDLE_DIR" -type f

          ARTIFACTS=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            base="$(basename "$file")"
            # Only upload bundle artifacts, not icons/metadata
            case "$base" in
              *.deb|*.AppImage|*.rpm|*.msi|*.exe|*.dmg|*.app.tar.gz) ;;
              *) echo "Skipping $base" ; continue ;;
            esac
            new_name="$(echo "$base" | sed "s|VS Code Launchpad|VS.Code.Launchpad_${PLATFORM}|" | sed 's/ /./g')"
            cp "$file" "$new_name"
            ARTIFACTS+=("$new_name")
            echo "Prepared: $new_name"
          done < <(find "$BUNDLE_DIR" -type f)

          if [ ${#ARTIFACTS[@]} -eq 0 ]; then
            echo "::warning::No bundle artifacts found for $TRIPLE"
            exit 0
          fi

          gh release upload "${{ github.ref_name }}" "${ARTIFACTS[@]}" \
            --repo "${{ github.repository }}" --clobber 2>&1 || {
            echo "Upload failed — creating release and retrying..."
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "VS Code Launchpad ${{ github.ref_name }}" \
              --draft --notes "" 2>&1
            gh release upload "${{ github.ref_name }}" "${ARTIFACTS[@]}" \
              --repo "${{ github.repository }}" --clobber
          }
          echo "$PLATFORM artifacts uploaded"

  # Fill in the draft's release notes (GitHub auto-generated).
  #
  # Uses the REST API by release id on purpose:
  # - draft releases are invisible to /releases/tags/<tag>, so `gh release edit <tag>`
  #   cannot find them; we look the id up in the /releases listing instead
  # - softprops/action-gh-release@v1 silently failed to apply notes to drafts and
  #   rewrote tag_name to `untagged-*`, which created a junk tag on publish (v0.2.0)
  update-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update draft release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            echo "::error::No release found for tag $TAG"
            exit 1
          fi

          notes=$(gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body)

          prerelease=false
          case "$TAG" in *beta*) prerelease=true ;; esac

          gh api -X PATCH "repos/$REPO/releases/$id" \
            -f tag_name="$TAG" \
            -f body="$notes" \
            -F draft=true \
            -F prerelease="$prerelease" \
            --jq '"Release \(.id): tag=\(.tag_name) draft=\(.draft) prerelease=\(.prerelease) notes=\(.body | length) chars"'

          # Guard against the old failure mode: the tag must still be intact
          actual=$(gh api "repos/$REPO/releases/$id" --jq .tag_name)
          if [ "$actual" != "$TAG" ]; then
            echo "::error::Release tag_name is '$actual', expected '$TAG'"
            exit 1
          fi
